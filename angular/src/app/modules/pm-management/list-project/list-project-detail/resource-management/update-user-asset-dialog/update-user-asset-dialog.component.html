<div class="card-header px-0">
  <h4>Update Assets for: <strong>{{ data.fullName }}</strong></h4>
</div>

<div class="form-group mt-4">
  <div class="row">
    <label class="col-md-2 col-form-label" for="assets">Assets:</label>
    <div class="col-md-10">
      <mat-form-field class="w-100" appearance="outline">
        <mat-select multiple [(ngModel)]="selectedAssets" 
          style="position: sticky; top: 0; z-index: 2; background-color: white;"
          required name="assets" placeholder="select assets" #assets="ngModel"
          (openedChange)="openedChange($event)">
          <mat-form-field class="w-100 px-3">
            <input matInput [(ngModel)]="searchAsset" name="searchAssetName"
              placeholder="Search" #search (input)="$event.stopPropagation();"
            >
          </mat-form-field>
          <div class="mb-2 ml-3">
            <button type="button" class="btn bg-primary" (click)="selectAll()">
              Select All
            </button>
            <button type="button" class="btn bg-secondary ml-4" (click)="clear()">
              Clear
            </button>
          </div>
          <mat-option *ngFor="let asset of filteredAssets | listFilter : 'name' : searchAsset" 
            [value]="asset.id" (click)="$event.stopPropagation(); onSelectChange(asset.id)">
            {{ asset.assetName }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</div>

<div class="d-flex justify-content-end mt-3">
  <button class="btn btn-secondary btn-action mr-2" mat-dialog-close>
    Cancel
  </button>
  <button class="btn btn-primary btn-action" (click)="saveAndClose()" [disabled]="isLoading">
    <span *ngIf="!isLoading">Save</span>
    <span *ngIf="isLoading">
      <mat-spinner diameter="20" style="display: inline-block"></mat-spinner>
    </span>
  </button>
</div>
