<h2 mat-dialog-title class="text-primary border-bottom pb-2">
    <i class="fas fa-clipboard-check mr-2"></i> 
    Final Step: Review Contribution List
</h2>

<mat-dialog-content class="mt-3">
    <p class="text-muted">Please review the contribution list for the report: <strong>{{data.reportName}}</strong></p>
    
    <div class="table-responsive" style="max-height: 60vh;">
        <table class="table table-bordered table-striped">
            <thead class="bg-light sticky-top">
                <tr>
                    <th>Employee / Charge Name</th>
                    <th>Linked Resources & Contribution (%)</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let pu of data.projectUserBills">
                    <td>
                        <div class="font-weight-bold">{{pu.billAccountName}}</div>
                        <small class="text-muted">{{pu.billRole}}</small>
                    </td>
                    <td>
                        <div *ngIf="pu.linkedResources && pu.linkedResources.length > 0; else noLink">
                            <div *ngFor="let res of pu.linkedResources" class="d-flex justify-content-between border-bottom py-1">
                                <span>{{res.fullName}}</span>
                                <span class="badge" [style.backgroundColor]="'#28a745'" style="color: white; min-width: 50px;">
                                    {{res.contribute}}%
                                </span>
                            </div>
                        </div>
                        <ng-template #noLink>
                            <span class="text-danger small"><i class="fas fa-exclamation-triangle"></i> No linked resource</span>
                        </ng-template>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="border-top pt-2">
    <button mat-button (click)="onCancel()">Back</button>
    <button mat-raised-button color="primary" (click)="onConfirm()">
        <i class="fas fa-paper-plane mr-1"></i> Confirm & Submit
    </button>
</mat-dialog-actions>
