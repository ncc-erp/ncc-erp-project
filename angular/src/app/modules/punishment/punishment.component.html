<div>
  <section class="content-header pb-1">
    <div class="container-fluid">
      <div class="row">
        <div class="col-6">
          <h1>Punishment</h1>
        </div>
        <div class="col-6 text-right">
          <button href="javascript:;" class="btn btn-primary mr-2" (click)="createPunishment()">
            <i class="fa fa-plus-square"></i> Import Punishment
          </button>
          <button class="btn btn-success" (click)="downloadTemplate()">
            <i class="fa fa-download"></i> Download Template
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="content px-2">
    <div class="container-fluid">
      <div class="card">
        <div class="card-header">
          <div class="input-group">
            <div class="input-group-prepend">
              <button type="button" class="btn bg-blue" (click)="getDataPage(1)">
                <i class="fas fa-search"></i>
              </button>
            </div>
            <input type="text" class="form-control" name="keyword" placeholder="Search" [(ngModel)]="searchText"
              (keyup.enter)="getDataPage(1)" />
            <div class="input-group-append">
              <button type="button" class="btn btn-default" (click)="checkAddFilter()">
                <i class="fas" [class.fa-angle-up]="advancedFiltersVisible"
                  [class.fa-angle-down]="!advancedFiltersVisible"></i>
              </button>
            </div>
          </div>
        </div>
        <div *ngIf="advancedFiltersVisible" class="mb-0 mt-1">
          <div class="card-body">
            <form class="form-horizontal">
              <div class="row">
                <div class="col-md-12 col-xl-12">
                  <div class="mb-0">
                    <div class="card-filter">
                      <div *ngFor="let item of filterItems; let i = index">
                        <app-filter [item]="item" (emitChange)="onEmitChange($event, i)"
                          (deleteDataFilter)="deleteFilterItem(i)" [inputFilters]="FILTER_CONFIG">
                        </app-filter>
                      </div>
                      <i style="padding: 0;" class="fas fa-plus-circle ml-3 icon-add-filter"
                        [ngClass]="{'icon-add-filter-item': filterItems?.length}" (click)="addFilter()"></i>
                    </div>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
        <div class="card-body table-responsive p-0">
          <table class="table table-hover text-nowrap">
            <thead class="bg-light">
              <tr>
                <th>STT</th>
                <th>Month/Year</th>
                <th>Attached File</th>
                <th>Note</th>
                <th style="width: 200px;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let item of punishments | paginate: {
                    id: 'server',
                    itemsPerPage: pageSize,
                    currentPage: pageNumber,
                    totalItems: totalItems
                  }; let i = index">
                <td>{{ (pageNumber - 1) * pageSize + i + 1 }}</td>
                <td>{{ item.month }}/{{ item.year }}</td>
                <td>
                  <div class="d-flex col-12 p-0">
                    <span class="text-nowrap w-100 text-truncate file-link" (click)=" downloadFile(item.id)">
                      {{ item.fileName }}
                    </span>
                  </div>
                </td>
                <td>{{ item.note }}</td>
                <td>
                  <button type="button" class="btn btn-sm btn-primary mx-1" (click)="editPunishment(item)">
                    <i class="fas fa-pencil-alt"></i> Edit
                  </button>
                  <button type="button" class="btn btn-sm btn-danger mx-1" (click)="delete(item)">
                    <i class="fas fa-trash"></i> Delete
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="card-footer bg-light border-top">
          <div class="row">
            <div class="col-sm-4 col-12 text-sm-left text-center">
              <button class="btn btn-secondary" (click)="refresh()">
                <i class="fas fa-redo-alt"></i> Refresh
              </button>
            </div>
            <div class="col-sm-4 col-12 text-center">
              <p class="mb-0 my-2">Total: {{ totalItems }} records</p>
            </div>
            <div class="col-sm-4 col-12">
              <div class="float-sm-right m-auto">
                <abp-pagination-controls id="server" (pageChange)="getDataPage($event)"></abp-pagination-controls>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
