<div class="d-flex justify-content-start align-items-center gap-2">
  <button class="btn btn-sm btn-outline-primary" (click)="selectAll()">
    Select All
  </button>
  <button class="btn btn-sm btn-outline-secondary ml-2" (click)="clear()">
    Clear
  </button>
  <button *ngIf="showDone" class="btn btn-sm btn-success ml-2" (click)="doneSelectSkill()">
    Done
  </button>
</div>
