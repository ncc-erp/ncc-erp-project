<div class="all_dialog">
    <h3 class="header_h h_drag_and_drop">Upload CV</h3>
    <form action="" class="py-2 border-top">
        <div class="d-flex flex-column">
            <label for="file">Choose file:</label>
            <input type="file" class="form-group" id="file">
        </div>
        <div class="d-flex flex-column">
            <mat-form-field appearance="outline" floatLabel="auto">
                <mat-label>Enter Name CV</mat-label>
                <input
                    type="text"
                    matInput
                    required
                />
            </mat-form-field>
        </div>
        <div class="d-flex justify-content-start">
            <button mat-flat-button color="primary" class="btn btn-primary mr-2">Import</button>
            <button mat-raised-button class="btn btn-secondary" mat-dialog-close>Cancel</button>
        </div>
    </form>
</div>
