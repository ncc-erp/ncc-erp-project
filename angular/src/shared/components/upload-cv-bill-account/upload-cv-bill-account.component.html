<div class="all_dialog">
    <h3 class="header_h h_drag_and_drop">Upload CV</h3>
    <form action="" class="py-2 border-top">
        <div class="d-flex flex-column">
            <label for="file">Choose file:</label>
            <input type="file"
                class="form-group"
                id="file"
                required
                accept=".doc,.docx,.pdf"
                aria-label="Choose CV file"
                (change)="handleFileInput($event)">
        </div>
        <div class="d-flex justify-content-start mt-2">
            <button mat-flat-button color="primary"
                class="btn btn-primary mr-2"
                [disabled]="!selectedFile"
                (click)="onSubmit()">
                Import
            </button>
            <button
                mat-raised-button class="btn btn-secondary"
                mat-dialog-close>
                Cancel
            </button>
        </div>
    </form>
</div>
